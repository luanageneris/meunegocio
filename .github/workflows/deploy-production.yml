name: Deploy Production Hostinger

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment file for Wayfinder generation
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate Wayfinder files
        run: php artisan wayfinder:generate

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Validate built manifest on runner
        run: |
          test -f dist/manifest.json
          ls -la dist | head -20

      - name: Backup current production build as fallback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            if [ -d "$APP_DIR/public/build" ] && [ -f "$APP_DIR/public/build/manifest.json" ]; then
              rm -rf "$APP_DIR/public/build_prev"
              cp -a "$APP_DIR/public/build" "$APP_DIR/public/build_prev"
            fi

      - name: Run production deploy script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            bash "${{ secrets.PROD_APP_DIR }}/deploy-production.sh"

      - name: Restore fallback build if deploy cleaned assets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            if [ ! -f "$APP_DIR/public/build/manifest.json" ] && [ -f "$APP_DIR/public/build_prev/manifest.json" ]; then
              rm -rf "$APP_DIR/public/build"
              cp -a "$APP_DIR/public/build_prev" "$APP_DIR/public/build"
            fi

      - name: Prepare temporary build directory on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            mkdir -p "${{ secrets.PROD_APP_DIR }}/public/build_tmp"
            rm -rf "${{ secrets.PROD_APP_DIR }}/public/build_tmp"/*

      - name: Upload built assets to temporary directory
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          source: dist/*
          target: ${{ secrets.PROD_APP_DIR }}/public/build_tmp
          strip_components: 1

      - name: Promote temporary build atomically
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            test -f "$APP_DIR/public/build_tmp/manifest.json"
            rm -rf "$APP_DIR/public/build_prev"
            if [ -d "$APP_DIR/public/build" ]; then mv "$APP_DIR/public/build" "$APP_DIR/public/build_prev"; fi
            mv "$APP_DIR/public/build_tmp" "$APP_DIR/public/build"

      - name: Verify manifest exists on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            APP_DIR="${{ secrets.PROD_APP_DIR }}"
            test -f "$APP_DIR/public/build/manifest.json"
            ls -la "$APP_DIR/public/build" | head -20

      - name: Report deployed revision
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_PORT }}
          script_stop: true
          script: |
            cd "${{ secrets.PROD_APP_DIR }}"
            echo "EXPECTED_SHA=${GITHUB_SHA}"
            echo "DEPLOYED_SHA=$(git rev-parse HEAD)"
            echo "DEPLOYED_SHORT_SHA=$(git rev-parse --short HEAD)"

      - name: Health check production
        run: |
          curl --fail --silent --show-error --location --max-time 30 "${{ secrets.PROD_HEALTHCHECK_URL }}"

